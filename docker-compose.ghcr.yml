# Use pre-built images from GitHub Container Registry
# Usage:
#   1. Create backend/.env with your Jira credentials (see backend/.env.example)
#   2. docker compose -f docker-compose.ghcr.yml up

services:
  backend:
    image: ghcr.io/alt-f1-openclaw/atlassian-jira-ui-backend:latest
    ports:
      - "35400:35400"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    image: ghcr.io/alt-f1-openclaw/atlassian-jira-ui-frontend:latest
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
