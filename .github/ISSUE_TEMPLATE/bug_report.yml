name: 🐛 Bug Report
description: Something isn't working correctly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.
  - type: input
    id: version
    attributes:
      label: App Version
      description: Which version are you running? (check About page or footer)
      placeholder: e.g. v1.60.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Development (local)
        - Docker (self-hosted)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect?
      placeholder: |
        **What happened:**
        The sprint dashboard shows no data after switching sites.

        **What I expected:**
        Sprint data should load for the newly selected Jira site.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Log in with OAuth
        2. Switch to a different Jira site from the user menu
        3. Navigate to Sprint Dashboard
        4. Observe empty state
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Paste screenshots or browser console errors if available.
    validations:
      required: false
