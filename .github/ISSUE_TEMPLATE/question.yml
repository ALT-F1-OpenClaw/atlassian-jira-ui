name: ❓ Question
description: Ask about setup, usage, or architecture
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Have a question about the app? Ask away!
        For security vulnerabilities, please see [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: |
        How do I configure OAuth 2.0 for my self-hosted deployment?
    validations:
      required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Setup / Installation
        - OAuth / Authentication
        - Docker / Deployment
        - Features / Usage
        - API / Backend
        - Contributing
        - Other
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Environment details, what you've already tried, etc.
    validations:
      required: false
