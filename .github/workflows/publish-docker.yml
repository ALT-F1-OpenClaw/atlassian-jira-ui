name: Publish Docker Images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish-backend:
    name: Publish Backend Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/alt-f1-openclaw/atlassian-jira-ui-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-frontend:
    name: Publish Frontend Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/alt-f1-openclaw/atlassian-jira-ui-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [publish-backend, publish-frontend]
    if: always()
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          TAG: ${{ github.ref_name }}
          BACKEND_STATUS: ${{ needs.publish-backend.result }}
          FRONTEND_STATUS: ${{ needs.publish-frontend.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No webhook configured — skipping notification"
            exit 0
          fi

          if [ "$BACKEND_STATUS" = "success" ] && [ "$FRONTEND_STATUS" = "success" ]; then
            EMOJI="✅"
            STATUS="success"
            COLOR=3066993
            MSG="Docker images **${TAG}** published to GHCR (amd64 + arm64)"
            FOOTER="Ready to deploy: ./deploy-prod.sh ${TAG}"
          else
            EMOJI="❌"
            STATUS="failed"
            COLOR=15158332
            MSG="Docker publish **${TAG}** failed — backend: ${BACKEND_STATUS}, frontend: ${FRONTEND_STATUS}"
            FOOTER="Check logs for details"
          fi

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"${EMOJI} Docker Publish: ${STATUS}\",
              \"description\": \"${MSG}\",
              \"url\": \"${RUN_URL}\",
              \"color\": ${COLOR},
              \"footer\": {\"text\": \"${FOOTER}\"}
            }]
          }" "$DISCORD_WEBHOOK" || true
