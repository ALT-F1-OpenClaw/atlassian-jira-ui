name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create dummy .env for docker-compose
        run: |
          cat > backend/.env << 'EOF'
          JIRA_HOST=https://test.atlassian.net
          JIRA_EMAIL=test@test.com
          JIRA_API_TOKEN=dummy-token
          APP_SECRET_KEY=ci-test-secret-key
          EOF

      - name: Build backend image
        run: docker build -t jira-ui-backend ./backend

      - name: Build frontend image
        run: docker build -t jira-ui-frontend ./frontend

      - name: Verify docker-compose config
        run: docker compose config --quiet
